name: Refresh the official claims' checks

# A consumer wants a decided check no older than a day or so (VaultGate's max age is 24 hours); left alone,
# the official claims' standings age out. This asks YieldClaim for a fresh check of each claim its deployer
# registered, twice a day: one consensus transaction each, in which every validator reads the page and the
# vault's share price. It signs with a throwaway testnet account funded from Studio Next's faucet
# (studio-next/refresh.ts). No secrets.
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-next/package-lock.json
      - run: npm ci
      - run: npx tsx refresh.ts
